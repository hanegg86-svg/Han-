<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือสร้างไอคอนแอป (Icon Generator)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">

    <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 text-center max-w-md w-full">
        <h1 class="text-xl font-bold text-slate-800 mb-2">🎨 เครื่องมือสร้างไฟล์ icon.png</h1>
        <p class="text-xs text-slate-500 mb-6">สร้างรูปภาพไอคอนขนาด 512x512 pixels สำหรับ PWA และ Favicon</p>

        <!-- Canvas Preview -->
        <div class="flex justify-center mb-6">
            <canvas id="iconCanvas" width="512" height="512" class="w-48 h-48 rounded-3xl shadow-lg border border-slate-200"></canvas>
        </div>

        <button onclick="downloadIcon()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow transition-colors flex items-center justify-center gap-2">
            <span>📥</span> ดาวน์โหลดไฟล์ icon.png
        </button>
        <p class="text-xs text-slate-400 mt-3">เมื่อดาวน์โหลดแล้ว ให้นำไฟล์ icon.png ไปวางในโฟลเดอร์เดียวกับ index.html</p>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('iconCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            // Background Gradient (Indigo to Blue)
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#4f46e5');
            grad.addColorStop(1, '#2563eb');
            ctx.fillStyle = grad;
            
            // Rounded Corners Background
            const r = 100;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(w - r, 0);
            ctx.quadraticCurveTo(w, 0, w, r);
            ctx.lineTo(w, h - r);
            ctx.quadraticCurveTo(w, h, w - r, h);
            ctx.lineTo(r, h);
            ctx.quadraticCurveTo(0, h, 0, h - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();

            // Receipt Paper (White Box)
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;
            
            const rx = 126, ry = 96, rw = 260, rh = 320;
            ctx.beginPath();
            ctx.roundRect(rx, ry, rw, rh, 20);
            ctx.fill();

            // Reset Shadow
            ctx.shadowColor = 'transparent';

            // Receipt Lines (Indigo placeholders)
            ctx.fillStyle = '#818cf8';
            ctx.roundRect(166, 140, 180, 18, 9);
            ctx.fill();

            ctx.fillStyle = '#c7d2fe';
            ctx.roundRect(166, 180, 140, 14, 7);
            ctx.roundRect(166, 210, 160, 14, 7);
            ctx.roundRect(166, 240, 120, 14, 7);
            ctx.fill();

            // Dashed Divider Line
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(166, 280);
            ctx.lineTo(346, 280);
            ctx.stroke();

            // Total Amount Line (Bold Emerald)
            ctx.setLineDash([]);
            ctx.fillStyle = '#10b981';
            ctx.roundRect(166, 310, 180, 22, 11);
            ctx.fill();

            // AI Sparkle Star (Yellow)
            ctx.fillStyle = '#fbbf24';
            drawStar(ctx, 360, 110, 5, 30, 15);
        };

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        function downloadIcon() {
            const canvas = document.getElementById('iconCanvas');
            const link = document.createElement('a');
            link.download = 'icon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
